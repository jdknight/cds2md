[tox]
envlist =
    # linters
    ruff
    pylint
    mypy
    # unit tests
    py{311,312,313,314,315}

[testenv]
commands =
    {envpython} -m unittest discover -v -s tests -p "test_*.py" {posargs:-b}
setenv =
    PYTHONDONTWRITEBYTECODE=1
usedevelop =
    true

[testenv:mainline]
commands_pre =
    {envpython} -c "print('\n' * 2)"
commands =
    {envpython} -m cds2md {posargs}
commands_post =
    {envpython} -c "print('\n' * 2)"
setenv =
    {[testenv]setenv}
    PYTHONUNBUFFERED=1
passenv =
    *

[testenv:coverage]
deps =
    coverage
commands =
    {envpython} -m coverage run --module unittest discover -b -s tests -p "test_*.py" {posargs}
    - {envpython} -m coverage combine
    {envpython} -m coverage html
    {envpython} -m coverage report

[testenv:mypy]
deps =
    mypy: mypy==2.4.1
setenv =
    {[testenv]setenv}
    MYPY_CACHE_DIR={toxworkdir}/.mypy_cache
commands =
    mypy \
    cds2md

[testenv:pylint]
deps =
    pylint: pylint==4.1.3
setenv =
    {[testenv]setenv}
    PYLINTHOME={toxworkdir}/.pylint_cache
commands =
    pylint \
    cds2md \
    tests

[testenv:ruff]
deps =
    ruff: ruff==0.17.4
setenv =
    {[testenv]setenv}
    RUFF_CACHE_DIR={toxworkdir}/.ruff_cache
commands =
    ruff \
    check \
    cds2md \
    tests
